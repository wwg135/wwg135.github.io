name: Build Repo Index and Deploy Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Ensure dpkg-scanpackages is available
        run: |
          if ! command -v dpkg-scanpackages >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dpkg-dev
          fi
          dpkg-scanpackages --version | head -1

      - name: Rebuild packages
          set -euo pipefail
          sudo dpkg-scanpackages -m . /dev/null > Packages
          bzip2 -c Packages > Packages.bz2
          xz -c Packages > Packages.xz
          echo "Index entries: $(grep -c '^Package:' Packages || true)"
          grep -E '^(Package|Version|Architecture):' Packages || true

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2 Packages.xz
          if git diff --cached --quiet; then
            echo "unchanged, skipping commit"
          else
            git commit -m "Auto-update package"
            git push || (git pull --rebase --autostash && git push)
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
